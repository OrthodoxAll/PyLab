[project]
name = "pythonproject"
version = "0.1.0"
description = ""
authors = [
    {name = "OrthodoxAll",email = "aleksandernagiev@yandex.ru"}
]
requires-python = ">=3.14"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "requests (>=2.34.2,<3.0.0)"
]
lint = [
    "isort (>=8.0.1,<9.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "flake8 (>=7.3.0,<8.0.0)"
]

[tool.isort]
profile = "black"

[tool.black]
line-length = 119
exclude = '''
(
    ^\.idea
  | ^\.mypy_cache
  | ^\.venv
)
'''

[tool.mypy]
strict = true